<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Fast Is 400ms?</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { touch-action: manipulation; } /* prevent double-tap zoom */

        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-card-hover: #1a1a26;
            --purple-glow: #836EF9;
            --purple-dim: #5a4ab5;
            --green: #00f5a0;
            --red: #ff3b5c;
            --yellow: #ffd700;
            --orange: #ff8c00;
            --cyan: #00d4ff;
            --text-primary: #f0f0f5;
            --text-secondary: #8888a0;
            --text-dim: #555570;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background grid effect */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(131, 110, 249, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(131, 110, 249, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, var(--purple-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header h1 .accent {
            background: linear-gradient(135deg, var(--purple-glow) 0%, #b86eff 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 400;
        }

        /* Game Area */
        .game-area {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 20px;
            background: var(--bg-card);
            border: 1px solid rgba(131, 110, 249, 0.15);
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
            margin-bottom: 32px;
        }

        .game-area:hover {
            border-color: rgba(131, 110, 249, 0.3);
        }

        /* Click target button */
        .click-target {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            z-index: 3;
            transition: transform 0.1s, box-shadow 0.1s;
            outline: none;
        }

        .click-target:hover {
            transform: scale(1.08);
        }

        .click-target:active {
            transform: scale(0.95);
        }

        .click-target.target-start {
            background: linear-gradient(135deg, var(--purple-glow), #b86eff);
            color: #fff;
            box-shadow: 0 0 20px rgba(131, 110, 249, 0.4);
        }

        .click-target.target-go {
            background: linear-gradient(135deg, var(--green), #00c97f);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 245, 160, 0.5);
            animation: targetPulse 0.6s ease-in-out infinite alternate;
        }

        @keyframes targetPulse {
            from { box-shadow: 0 0 20px rgba(0, 245, 160, 0.4); }
            to { box-shadow: 0 0 40px rgba(0, 245, 160, 0.7); }
        }

        .click-target.target-result {
            background: linear-gradient(135deg, var(--purple-glow), #b86eff);
            color: #fff;
            box-shadow: 0 0 20px rgba(131, 110, 249, 0.4);
            width: auto;
            height: auto;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 0.85rem;
            left: 50% !important;
            bottom: 56px !important;
            top: auto !important;
            transform: translateX(-50%) !important;
        }

        .click-target.target-early {
            background: linear-gradient(135deg, var(--red), #cc2040);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 59, 92, 0.4);
        }

        .game-status {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            pointer-events: none;
            z-index: 2;
        }

        .game-status .status-text {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .game-area.state-waiting {
            background: var(--bg-card);
        }

        .game-area.state-ready {
            background: linear-gradient(135deg, #1a0a0a, #2a0a0a);
            border-color: rgba(255, 59, 92, 0.3);
        }

        .game-area.state-go {
            background: linear-gradient(135deg, #0a1a0a, #0a2a0a);
            border-color: rgba(0, 245, 160, 0.5);
            box-shadow: 0 0 60px rgba(0, 245, 160, 0.15), inset 0 0 60px rgba(0, 245, 160, 0.05);
            animation: pulseGreen 0.4s ease-out;
        }

        @keyframes pulseGreen {
            0% { box-shadow: 0 0 120px rgba(0, 245, 160, 0.4), inset 0 0 120px rgba(0, 245, 160, 0.15); }
            100% { box-shadow: 0 0 60px rgba(0, 245, 160, 0.15), inset 0 0 60px rgba(0, 245, 160, 0.05); }
        }

        .game-area.state-result {
            border-color: rgba(131, 110, 249, 0.3);
        }

        .game-area.state-early {
            background: linear-gradient(135deg, #1a0a0a, #2a0a0a);
            border-color: rgba(255, 59, 92, 0.4);
        }

        /* Result overlay (shown in center after clicking target) */
        .result-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 2;
            pointer-events: none;
        }

        .result-overlay .reaction-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 12px;
        }

        .result-overlay .reaction-time .unit {
            font-size: 1.8rem;
            font-weight: 500;
            opacity: 0.6;
            margin-left: 4px;
        }

        .result-overlay .verdict {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .color-green { color: var(--green); }
        .color-red { color: var(--red); }
        .color-yellow { color: var(--yellow); }
        .color-purple { color: var(--purple-glow); }
        .color-orange { color: var(--orange); }
        .color-cyan { color: var(--cyan); }

        /* Ripple effect on click */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* Chain comparison section */
        .chains-section {
            margin-bottom: 32px;
        }

        .chains-section h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 16px;
        }

        .chain-bars {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chain-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .chain-label {
            width: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: right;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .chain-logo {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .chain-bar-container {
            flex: 1;
            height: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            position: relative;
            overflow: visible;
        }

        .chain-bar {
            height: 100%;
            border-radius: 8px;
            position: relative;
            display: flex;
            align-items: center;
            transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1);
            width: 0%;
        }

        .chain-bar-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            position: absolute;
            right: -8px;
            transform: translateX(100%);
            color: var(--text-secondary);
        }

        /* When bar is wide enough, put label inside */
        .chain-bar-time.inside {
            right: 10px;
            transform: none;
            color: var(--text-primary);
        }

        .chain-bar.monad { background: linear-gradient(90deg, rgba(131, 110, 249, 0.4), rgba(131, 110, 249, 0.7)); }
        .chain-bar.you { background: linear-gradient(90deg, rgba(0, 245, 160, 0.4), rgba(0, 245, 160, 0.7)); }
        .chain-bar.solana { background: linear-gradient(90deg, rgba(0, 212, 255, 0.3), rgba(0, 212, 255, 0.6)); }
        .chain-bar.ethereum {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.4));
            border-radius: 8px 0 0 8px;
        }
        .chain-bar.bitcoin {
            background: linear-gradient(90deg, rgba(255, 140, 0, 0.3), rgba(255, 140, 0, 0.6));
            border-radius: 8px 0 0 8px;
        }

        /* Overflow chains — scaled */
        .chain-bar.overflow {
            transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1);
            background-repeat: no-repeat;
            position: relative;
            border-radius: 8px 0 0 8px;
        }

        .chain-bar.overflow::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 40px;
            background: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 4px,
                rgba(255,255,255,0.06) 4px,
                rgba(255,255,255,0.06) 8px
            );
            border-radius: 0;
        }

        /* Outside time label for overflow chains */
        .chain-time-outside {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            margin-left: 10px;
            flex-shrink: 0;
            color: var(--text-secondary);
        }

        .chain-time-outside .mult {
            color: var(--text-dim);
            font-weight: 500;
        }

        .you-marker {
            position: absolute;
            top: -8px;
            bottom: -8px;
            width: 2px;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            z-index: 5;
            transition: left 1.5s cubic-bezier(0.16, 1, 0.3, 1);
            left: 0%;
        }

        .you-marker::after {
            content: 'YOU';
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--green);
            letter-spacing: 0.1em;
        }


        /* Stats strip */
        .stats-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(131, 110, 249, 0.1);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-card .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--purple-glow);
        }

        .stat-card .stat-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }

        /* History */
        .history-section h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        .history-bars {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 80px;
            padding: 0 4px;
        }

        .history-bar {
            flex: 1;
            min-width: 8px;
            max-width: 28px;
            border-radius: 4px 4px 0 0;
            transition: height 0.3s ease;
            position: relative;
        }

        .history-bar:hover::after {
            content: attr(data-time);
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-primary);
            background: var(--bg-card);
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            border: 1px solid rgba(131, 110, 249, 0.2);
        }

        .monad-line {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            border-bottom: 2px dashed rgba(131, 110, 249, 0.4);
            z-index: 2;
            pointer-events: none;
        }

        .monad-line::after {
            content: 'MONAD 400ms';
            position: absolute;
            right: 0;
            bottom: 2px;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--purple-dim);
            letter-spacing: 0.05em;
        }

        .hidden { display: none !important; }

        /* Countdown flash */
        .countdown-flash {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.08);
            pointer-events: none;
            z-index: 1;
        }

        /* Scanline effect */
        .game-area::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
            pointer-events: none;
            border-radius: 20px;
        }

        /* Mobile */
        @media (max-width: 640px) {
            .container { padding: 24px 16px; }
            .header { margin-bottom: 32px; }
            .header h1 { font-size: 2rem; }
            .header p { font-size: 0.95rem; }
            .game-area { height: 300px; }
            .result-overlay .reaction-time { font-size: 3.2rem; }
            .result-overlay .verdict { font-size: 1rem; }
            .click-target { width: 70px; height: 70px; font-size: 0.65rem; }
            .click-target.target-result { padding: 10px 24px; }
            .stats-strip { grid-template-columns: repeat(2, 1fr); }
            .stat-card .stat-value { font-size: 1.2rem; }
            .chain-label { width: 36px; font-size: 0; gap: 0; }
            .chain-label span { display: none; }
            .chain-logo { width: 24px; height: 24px; font-size: 10px; }
            .chain-row { gap: 8px; }
            .chain-bar-time { font-size: 0.6rem; padding: 0 6px; }
            .chain-bar-container { height: 34px; }
            .chains-section { margin-bottom: 24px; }
            .history-bars { height: 60px; }
        }

        @media (max-width: 380px) {
            .header h1 { font-size: 1.7rem; }
            .result-overlay .reaction-time { font-size: 2.6rem; }
            .click-target { width: 64px; height: 64px; }
            .stat-card { padding: 12px 8px; }
            .stat-card .stat-value { font-size: 1rem; }
        }

        /* Beat Monad celebration */
        @keyframes confettiBurst {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(-200px) rotate(720deg) scale(0); opacity: 0; }
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 10;
        }

        /* Hide cursor on game area during ready state */
        .game-area.state-ready { cursor: default; }
        .game-area.state-go { cursor: default; }

        .chain-bars-wrapper {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>How Fast Is <span class="accent">400ms</span>?</h1>
            <p>Can you react faster than Monad finalizes a block?</p>
        </div>

        <div class="game-area state-waiting" id="gameArea">
            <button class="click-target target-start" id="clickTarget" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">START</button>
            <div class="result-overlay hidden" id="resultOverlay"></div>
            <div class="game-status" id="gameStatus">
                <span class="status-text">Click the button to test your reaction time</span>
            </div>
        </div>

        <!-- Chain comparison bars (hidden until first result) -->
        <div class="chains-section hidden" id="chainsSection">
            <h2>Finality Race</h2>
            <div class="chain-bars-wrapper">
                <div class="chain-bars" id="chainBars">
                    <div class="chain-row">
                        <div class="chain-label">
                            <span style="color: var(--green)">You</span>
                            <div class="chain-logo" style="background: var(--green); color: #000;">Y</div>
                        </div>
                        <div class="chain-bar-container">
                            <div class="chain-bar you" id="barYou"></div>
                        </div>
                    </div>
                    <div class="chain-row">
                        <div class="chain-label">
                            <span style="color: var(--purple-glow)">Monad</span>
                            <div class="chain-logo" style="background: var(--purple-glow); color: #fff;">M</div>
                        </div>
                        <div class="chain-bar-container">
                            <div class="chain-bar monad" id="barMonad"></div>
                        </div>
                    </div>
                    <div class="chain-row">
                        <div class="chain-label">
                            <span style="color: var(--cyan)">Solana</span>
                            <div class="chain-logo" style="background: var(--cyan); color: #000;">S</div>
                        </div>
                        <div class="chain-bar-container">
                            <div class="chain-bar solana" id="barSolana"></div>
                        </div>
                    </div>
                    <div class="chain-row">
                        <div class="chain-label">
                            <span style="color: var(--text-primary)">Ethereum</span>
                            <div class="chain-logo" style="background: #fff; color: #000;">E</div>
                        </div>
                        <div class="chain-bar-container">
                            <div class="chain-bar ethereum overflow" id="barEthereum"></div>
                        </div>
                    </div>
                </div>
            </div>
            <p style="text-align: center; margin-top: 12px; font-size: 0.95rem;"><a href="https://docs.monad.xyz" target="_blank" rel="noopener" style="color: var(--purple-glow); text-decoration: none; border-bottom: 1px solid rgba(131, 110, 249, 0.4); transition: border-color 0.2s;">How does Monad do this? Read here!</a></p>
        </div>

        <!-- Stats -->
        <div class="stats-strip" id="statsStrip">
            <div class="stat-card">
                <div class="stat-value" id="statBest">--</div>
                <div class="stat-label">Best</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statAvg">--</div>
                <div class="stat-label">Average</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statAttempts">0</div>
                <div class="stat-label">Attempts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statBeats">0</div>
                <div class="stat-label">Beat Monad</div>
            </div>
        </div>

        <!-- History -->
        <div class="history-section hidden" id="historySection">
            <h2>Reaction History</h2>
            <div style="position: relative;">
                <div class="history-bars" id="historyBars"></div>
                <div class="monad-line" id="monadLine" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        const CHAINS = {
            monad:    { time: 400,      label: 'Monad',    color: '#836EF9' },
            solana:   { time: 12800,    label: 'Solana',   color: '#00d4ff' },
            ethereum: { time: 384000,   label: 'Ethereum', color: '#ffffff' },
            bitcoin:  { time: 600000,   label: 'Bitcoin',  color: '#ff8c00' },
        };

        const MAX_DISPLAY_MS = 600000;
        const TARGET_SIZE = 80;

        let state = 'waiting'; // waiting | ready | go | result | early
        let goTimestamp = 0;
        let timeoutId = null;
        let results = [];

        const gameArea = document.getElementById('gameArea');
        const clickTarget = document.getElementById('clickTarget');
        const resultOverlay = document.getElementById('resultOverlay');
        const gameStatus = document.getElementById('gameStatus');
        const chainsSection = document.getElementById('chainsSection');
        const historySection = document.getElementById('historySection');

        function setState(newState) {
            state = newState;
            gameArea.className = 'game-area state-' + newState;
        }

        function randomizeTargetPosition() {
            const area = gameArea.getBoundingClientRect();
            // Get actual rendered size of target (varies on mobile)
            const targetW = clickTarget.offsetWidth || TARGET_SIZE;
            const targetH = clickTarget.offsetHeight || TARGET_SIZE;
            const pad = 12;
            const maxX = area.width - targetW - pad * 2;
            const maxY = area.height - targetH - pad * 2 - 40; // leave room for status
            const x = pad + Math.random() * Math.max(maxX, 0);
            const y = pad + Math.random() * Math.max(maxY, 0);
            clickTarget.style.left = x + 'px';
            clickTarget.style.top = y + 'px';
            clickTarget.style.transform = 'none';
        }

        // Only the button is clickable — no keyboard, no clicking the background
        clickTarget.addEventListener('click', (e) => {
            e.stopPropagation();

            // Ripple on the game area
            const rect = gameArea.getBoundingClientRect();
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = (e.clientX - rect.left) + 'px';
            ripple.style.top = (e.clientY - rect.top) + 'px';
            ripple.style.width = ripple.style.height = '100px';
            gameArea.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);

            if (state === 'waiting' || state === 'result' || state === 'early') {
                startRound();
            } else if (state === 'ready') {
                tooEarly();
            } else if (state === 'go') {
                recordResult();
            }
        });

        function startRound() {
            if (timeoutId) clearTimeout(timeoutId);
            setState('ready');
            resultOverlay.classList.add('hidden');

            // Hide the target during the wait phase
            clickTarget.style.display = 'none';
            gameStatus.innerHTML = '<span class="status-text" style="color: var(--red);">Wait for it...</span>';

            const delay = 1500 + Math.random() * 3500;
            timeoutId = setTimeout(() => {
                setState('go');
                goTimestamp = performance.now();

                // Show target at random position
                randomizeTargetPosition();
                clickTarget.style.display = 'flex';
                clickTarget.className = 'click-target target-go';
                clickTarget.textContent = 'CLICK!';
                gameStatus.innerHTML = '<span class="status-text" style="color: var(--green);">NOW! Hit the button!</span>';
            }, delay);
        }

        // Clicking background during ready = too early
        gameArea.addEventListener('click', (e) => {
            if (state === 'ready') {
                tooEarly();
            }
        });

        function tooEarly() {
            if (timeoutId) clearTimeout(timeoutId);
            setState('early');
            resultOverlay.classList.add('hidden');

            randomizeTargetPosition();
            clickTarget.style.display = 'flex';
            clickTarget.className = 'click-target target-early';
            clickTarget.textContent = 'RETRY';
            gameStatus.innerHTML = '<span class="status-text" style="color: var(--red);">Too early! Click the button to try again.</span>';
        }

        function recordResult() {
            const reactionMs = Math.round(performance.now() - goTimestamp);
            results.push(reactionMs);
            setState('result');

            const beatMonad = reactionMs < 400;
            const verdictColor = beatMonad ? 'color-green' : reactionMs < 500 ? 'color-yellow' : 'color-red';
            const verdictText = getVerdict(reactionMs);

            // Show result overlay in center
            resultOverlay.classList.remove('hidden');
            const displayTime = reactionMs < 1000
                ? `${reactionMs}<span class="unit">ms</span>`
                : `${(reactionMs / 1000).toFixed(2)}<span class="unit">s</span>`;
            resultOverlay.innerHTML = `
                <div class="reaction-time ${verdictColor}">${displayTime}</div>
                <div class="verdict ${verdictColor}">${verdictText}</div>
            `;

            // Show "Again" button centered at bottom
            clickTarget.className = 'click-target target-result';
            clickTarget.textContent = 'AGAIN';
            gameStatus.innerHTML = '<span class="status-text">Click the button to go again</span>';

            if (beatMonad) spawnConfetti();

            updateChainBars(reactionMs);
            updateStats();
            updateHistory();
        }

        function getVerdict(ms) {
            if (ms < 200) return "Inhuman. Are you botting?";
            if (ms < 300) return "Lightning reflexes!";
            if (ms < 400) return "You beat Monad! Barely.";
            if (ms < 500) return "Close! Monad was faster.";
            const blocks = Math.floor(ms / 400);
            if (blocks <= 1) return "Monad finalized ~1 block before you clicked.";
            return `Monad finalized ~${blocks} blocks in that time.`;
        }

        function updateChainBars(playerMs) {
            chainsSection.classList.remove('hidden');

            // Dynamic scale: the larger of You or Monad = 50% width
            // This zooms in on the You vs Monad race, then Solana/Ethereum explode off the chart
            const anchor = Math.max(playerMs, 400);
            const pct = (ms) => (ms / anchor) * 50; // anchor = 50%

            function setBar(id, ms, label) {
                const bar = document.getElementById(id);
                const widthPct = Math.min(Math.max(pct(ms), 1.5), 100);
                bar.style.width = widthPct + '%';
                const isSmall = widthPct < 18;
                bar.innerHTML = `<span class="chain-bar-time${isSmall ? '' : ' inside'}">${label}</span>`;
            }

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    setBar('barYou', playerMs, formatTime(playerMs));
                    setBar('barMonad', 400, '400ms');

                    // These blow way past 100% — clamp and show overflow
                    document.getElementById('barSolana').style.width = '100%';
                    document.getElementById('barSolana').innerHTML = `<span class="chain-bar-time inside">12.8s</span>`;

                    document.getElementById('barEthereum').style.width = '100%';
                    document.getElementById('barEthereum').innerHTML = `<span class="chain-bar-time inside">6m 24s</span>`;
                });
            });

        }

        function formatTime(ms) {
            if (ms < 1000) return ms + 'ms';
            if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
            return Math.floor(ms / 60000) + 'm ' + Math.round((ms % 60000) / 1000) + 's';
        }

        function updateStats() {
            const best = Math.min(...results);
            const avg = Math.round(results.reduce((a, b) => a + b, 0) / results.length);
            const beats = results.filter(r => r < 400).length;

            document.getElementById('statBest').textContent = formatTime(best);
            document.getElementById('statAvg').textContent = formatTime(avg);
            document.getElementById('statAttempts').textContent = results.length;
            document.getElementById('statBeats').textContent = beats;
        }

        function updateHistory() {
            historySection.classList.remove('hidden');
            const container = document.getElementById('historyBars');
            container.innerHTML = '';

            const maxH = 80;
            const maxMs = 1000; // Cap visual at 1000ms

            // Show last 30 results
            const display = results.slice(-30);

            display.forEach((ms, i) => {
                const bar = document.createElement('div');
                bar.className = 'history-bar';
                const height = Math.min(ms / maxMs, 1) * maxH;
                bar.style.height = Math.max(height, 4) + 'px';
                bar.setAttribute('data-time', ms + 'ms');

                if (ms < 400) {
                    bar.style.background = 'var(--green)';
                } else if (ms < 500) {
                    bar.style.background = 'var(--yellow)';
                } else {
                    bar.style.background = 'var(--red)';
                }

                container.appendChild(bar);
            });

            // Monad line at 400ms
            const monadLine = document.getElementById('monadLine');
            const linePos = (400 / maxMs) * maxH;
            monadLine.style.display = 'block';
            monadLine.style.bottom = linePos + 'px';
        }

        function spawnConfetti() {
            const colors = ['#836EF9', '#00f5a0', '#ffd700', '#ff3b5c', '#00d4ff'];
            for (let i = 0; i < 30; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.background = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = (30 + Math.random() * 40) + '%';
                conf.style.top = (40 + Math.random() * 20) + '%';
                conf.style.animation = `confettiBurst ${0.6 + Math.random() * 0.8}s ease-out forwards`;
                conf.style.animationDelay = (Math.random() * 0.2) + 's';
                gameArea.appendChild(conf);
                setTimeout(() => conf.remove(), 1500);
            }
        }
    </script>
</body>
</html>
