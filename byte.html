<html><head><base href="https://expressive-3d-vector-head-responsive.com/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expressive 3D Vector Head Speaker</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    background-color: #000;
    color: #0f0;
  }
  #head-container {
    width: 100%;
    max-width: 600px;
    aspect-ratio: 1 / 1;
    margin-bottom: 20px;
    perspective: 2000px;
    cursor: pointer;
  }
  #captionContainer {
    width: 100%;
    max-width: 800px;
    text-align: center;
    margin-top: 20px;
    margin-bottom: 20px;
    min-height: 60px;
  }
  #caption {
    font-size: 18px;
    line-height: 1.5;
  }
  #textInput {
    width: 100%;
    max-width: 300px;
    height: 100px;
    padding: 10px;
    font-size: 16px;
    border-radius: 5px;
    border: 1px solid #0f0;
    background-color: #000;
    color: #0f0;
    box-sizing: border-box;
    margin-bottom: 10px;
  }
  #speakButton {
    width: calc(75% - 5px);
    max-width: 225px;
    padding: 10px 20px;
    font-size: 16px;
    background-color: #0f0;
    color: #000;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  #speakButton:hover {
    background-color: #00ff00;
  }
  #stopButton {
    width: calc(25% - 5px);
    max-width: 75px;
    padding: 10px 20px;
    font-size: 16px;
    background-color: #ff0000;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  #stopButton:hover {
    background-color: #cc0000;
  }
  #stopButton:disabled {
    background-color: #888;
    cursor: not-allowed;
  }
  @media (max-width: 600px) {
    #head-container {
      max-width: 90vw;
    }
    #textInput, #speakButton, #stopButton {
      max-width: 90vw;
    }
  }
</style>
</head>
<body>
<div id="head-container"></div>
<div id="captionContainer">
  <p id="caption"></p>
</div>
<textarea id="textInput" placeholder="Type your text here..."></textarea>
<div style="display: flex; justify-content: space-between; width: 100%; max-width: 300px;">
  <button id="speakButton">Chat</button>
  <button id="stopButton" disabled>Stop</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
<script>
let scene, camera, renderer, head, mouth, leftEyebrow, rightEyebrow, leftEye, rightEye;
let isIdling = true;
let isSpeaking = false;
let currentExpression = 'neutral';
const expressions = ['neutral', 'happy', 'sad', 'angry', 'surprised', 'confused', 'sleepy'];
let clickReactionTimeout;
let headMaterial;
let lastExpressionChangeTime = 0;
const apiKey = 'pH2chtVVq5466zufkcNzcAJu4EgxjEfF'; // Replace with your actual API key
let container, containerObserver;

function init() {
  scene = new THREE.Scene();
  container = document.getElementById('head-container');
  const aspect = container.clientWidth / container.clientHeight;
  camera = new THREE.PerspectiveCamera(75, aspect, 0.1, 2000);
  camera.position.z = 15;

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  headMaterial = new THREE.LineBasicMaterial({ color: 0x00ff00 });

  const headGeometry = new THREE.SphereGeometry(6, 32, 32);
  head = new THREE.LineSegments(new THREE.WireframeGeometry(headGeometry), headMaterial);
  scene.add(head);

  const eyeGeometry = new THREE.SphereGeometry(0.6, 16, 16);
  leftEye = new THREE.Group();
  rightEye = new THREE.Group();

  const eyeballLeft = new THREE.LineSegments(new THREE.WireframeGeometry(eyeGeometry), headMaterial);
  const eyeballRight = new THREE.LineSegments(new THREE.WireframeGeometry(eyeGeometry), headMaterial);

  const pupilGeometry = new THREE.SphereGeometry(0.3, 8, 8);
  const pupilMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const pupilLeft = new THREE.Mesh(pupilGeometry, pupilMaterial);
  const pupilRight = new THREE.Mesh(pupilGeometry, pupilMaterial);

  pupilLeft.position.z = 0.45;
  pupilRight.position.z = 0.45;

  leftEye.add(eyeballLeft, pupilLeft);
  rightEye.add(eyeballRight, pupilRight);

  leftEye.position.set(-2.1, 1.5, 4.5);
  rightEye.position.set(2.1, 1.5, 4.5);
  head.add(leftEye, rightEye);

  mouth = new THREE.Group();
  const upperLipGeometry = new THREE.TorusGeometry(1.5, 0.15, 16, 32, Math.PI);
  const lowerLipGeometry = new THREE.TorusGeometry(1.5, 0.15, 16, 32);
  const upperLip = new THREE.LineSegments(new THREE.WireframeGeometry(upperLipGeometry), headMaterial);
  const lowerLip = new THREE.LineSegments(new THREE.WireframeGeometry(lowerLipGeometry), headMaterial);
  upperLip.rotation.x = Math.PI / 2;
  lowerLip.rotation.x = -Math.PI / 2;
  upperLip.position.y = 0.15;
  lowerLip.position.y = -0.15;
  mouth.add(upperLip, lowerLip);
  mouth.position.set(0, -1.5, 4.5);
  head.add(mouth);

  const eyebrowGeometry = new THREE.TorusGeometry(0.75, 0.15, 16, 32, Math.PI);
  leftEyebrow = new THREE.LineSegments(new THREE.WireframeGeometry(eyebrowGeometry), headMaterial);
  rightEyebrow = new THREE.LineSegments(new THREE.WireframeGeometry(eyebrowGeometry), headMaterial);
  leftEyebrow.rotation.z = Math.PI;
  rightEyebrow.rotation.z = Math.PI;
  leftEyebrow.position.set(-2.1, 2.7, 4.5);
  rightEyebrow.position.set(2.1, 2.7, 4.5);
  head.add(leftEyebrow, rightEyebrow);

  head.userData = { targetRotation: getRandomRotation() };

  containerObserver = new ResizeObserver(onContainerResize);
  containerObserver.observe(container);

  updateCameraAspect();

  window.addEventListener('resize', onWindowResize, false);
  animate();
}

function updateCameraAspect() {
  const aspect = container.clientWidth / container.clientHeight;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}

function onContainerResize(entries) {
  for (let entry of entries) {
    if (entry.target === container) {
      updateCameraAspect();
    }
  }
}

function getRandomRotation() {
  return {
    x: Math.random() * 0.2 - 0.1,
    y: Math.random() * 0.4 - 0.2,
    z: 0
  };
}

function onWindowResize() {
  updateCameraAspect();
}

function animate() {
  requestAnimationFrame(animate);
  if (isIdling) {
    idleAnimation();
  }
  renderer.render(scene, camera);
}

function randomEyeMovement() {
  const duration = 0.5;
  const ease = "power2.inOut";
  const range = 0.1;

  const newX = Math.random() * range - range / 2;
  const newY = Math.random() * range - range / 2;

  gsap.to([leftEye.children[1].position, rightEye.children[1].position], {
    x: newX,
    y: newY,
    duration,
    ease
  });
}

function crossEyes() {
  const duration = 0.5;
  const ease = "power2.inOut";

  gsap.to(leftEye.children[1].position, {
    x: -0.1,
    y: 0,
    duration,
    ease
  });

  gsap.to(rightEye.children[1].position, {
    x: 0.1,
    y: 0,
    duration,
    ease
  });
}

function blinkEyes() {
  const blinkDuration = 0.15;
  const halfBlinkDuration = blinkDuration / 2;

  gsap.to([leftEye.scale, rightEye.scale], {
    y: 0.1,
    duration: halfBlinkDuration,
    ease: "power2.in",
    onComplete: () => {
      gsap.to([leftEye.scale, rightEye.scale], {
        y: 1,
        duration: halfBlinkDuration,
        ease: "power2.out"
      });
    }
  });
}

function idleAnimation() {
  const time = Date.now() * 0.001;
  head.rotation.x += (head.userData.targetRotation.x - head.rotation.x) * 0.05;
  head.rotation.y += (head.userData.targetRotation.y - head.rotation.y) * 0.05;

  head.position.y = Math.sin(time) * 0.05;
  leftEyebrow.position.y = 2.7 + Math.sin(time * 1.5) * 0.05;
  rightEyebrow.position.y = 2.7 + Math.sin(time * 1.5 + 0.5) * 0.05;
  leftEyebrow.rotation.z = Math.PI + Math.sin(time * 2) * 0.02;
  rightEyebrow.rotation.z = Math.PI + Math.sin(time * 2 + 0.5) * 0.02;

  if (Date.now() - lastExpressionChangeTime > 5000) { 
    const newExpression = expressions[Math.floor(Math.random() * expressions.length)];
    setExpressionSmooth(newExpression);
    lastExpressionChangeTime = Date.now();

    head.userData.targetRotation = getRandomRotation();
  }

  if (Math.random() < 0.02 && currentExpression !== 'confused') {
    randomEyeMovement();
  }

  if (Math.random() < 0.01) {
    blinkEyes();
  }
}

function smoothTransition(startRotation, endRotation, duration) {
  gsap.to(head.rotation, {
    x: endRotation.x,
    y: endRotation.y,
    z: endRotation.z,
    duration: duration / 1000,
    ease: "power2.inOut",
    onComplete: () => {
      if (!isSpeaking) {
        isIdling = true;
      }
    }
  });
}

function centerHead() {
  isIdling = false;
  const startRotation = head.rotation.clone();
  const endRotation = new THREE.Euler(0, 0, 0);
  smoothTransition(startRotation, endRotation, 1000);
}

function setExpressionSmooth(expression) {
  const duration = 0.5;
  const ease = "power2.inOut";

  gsap.to([leftEye.scale, rightEye.scale], { x: 1, y: 1, z: 1, duration, ease });
  gsap.to([leftEyebrow.position, rightEyebrow.position], { y: 2.7, duration, ease });
  gsap.to([leftEyebrow.rotation, rightEyebrow.rotation], { z: Math.PI, duration, ease });
  gsap.to(mouth.scale, { x: 1, y: 1, z: 1, duration, ease });
  gsap.to(mouth.position, { x: 0, y: -1.5, z: 4.5, duration, ease });

  switch (expression) {
    case 'happy':
      gsap.to([leftEyebrow.rotation, rightEyebrow.rotation], { z: Math.PI + Math.PI / 12, duration, ease });
      gsap.to([leftEyebrow.position, rightEyebrow.position], { y: 2.9, duration, ease });
      gsap.to(mouth.children[0].rotation, { x: Math.PI / 2 - 0.3, duration, ease });
      gsap.to(mouth.children[1].rotation, { x: -Math.PI / 2 + 0.3, duration, ease });
      gsap.to([leftEye.scale, rightEye.scale], { y: 0.8, duration, ease });
      break;
    case 'sad':
      gsap.to(leftEyebrow.rotation, { z: Math.PI - Math.PI / 12, duration, ease });
      gsap.to(rightEyebrow.rotation, { z: Math.PI + Math.PI / 12, duration, ease });
      gsap.to([leftEyebrow.position, rightEyebrow.position], { y: 2.5, duration, ease });
      gsap.to(mouth.children[0].rotation, { x: Math.PI / 2 + 0.2, duration, ease });
      gsap.to(mouth.children[1].rotation, { x: -Math.PI / 2 - 0.2, duration, ease });
      break;
    case 'angry':
      gsap.to(leftEyebrow.rotation, { z: Math.PI - Math.PI / 6, duration, ease });
      gsap.to(rightEyebrow.rotation, { z: Math.PI + Math.PI / 6, duration, ease });
      gsap.to(leftEyebrow.position, { y: 2.9, x: -2.3, duration, ease });
      gsap.to(rightEyebrow.position, { y: 2.9, x: 2.3, duration, ease });
      gsap.to(mouth.children[0].rotation, { x: Math.PI / 2 + 0.3, duration, ease });
      gsap.to(mouth.children[1].rotation, { x: -Math.PI / 2 - 0.3, duration, ease });
      break;
    case 'surprised':
      gsap.to([leftEyebrow.rotation, rightEyebrow.rotation], { z: Math.PI - Math.PI / 12, duration, ease });
      gsap.to([leftEyebrow.position, rightEyebrow.position], { y: 3.1, duration, ease });
      gsap.to(mouth.scale, { x: 1.2, y: 1.2, z: 1.2, duration, ease });
      break;
    case 'confused':
      gsap.to(leftEyebrow.rotation, { z: Math.PI + Math.PI / 12, duration, ease });
      gsap.to(rightEyebrow.rotation, { z: Math.PI - Math.PI / 6, duration, ease });
      gsap.to(leftEyebrow.position, { y: 2.8, x: -2.2, duration, ease });
      gsap.to(rightEyebrow.position, { y: 2.6, x: 2.0, duration, ease });
      crossEyes();
      break;
    case 'sleepy':
      gsap.to([leftEyebrow.rotation, rightEyebrow.rotation], { z: Math.PI + Math.PI / 24, duration, ease });
      gsap.to([leftEyebrow.position, rightEyebrow.position], { y: 2.3, duration, ease });
      gsap.to(mouth.scale, { x: 0.8, y: 0.8, z: 0.8, duration, ease });
      break;
    case 'neutral':
    default:
      break;
  }

  currentExpression = expression;
}

function analyzeSentiment(text) {
  const lowercaseText = text.toLowerCase();
  const sentiments = {
    angry: ['angry', 'mad', 'furious', 'annoyed', 'irritated'],
    happy: ['happy', 'joy', 'excited', 'glad', 'cheerful'],
    sad: ['sad', 'unhappy', 'depressed', 'gloomy', 'miserable'],
    surprised: ['surprised', 'shocked', 'amazed', 'astonished'],
    confused: ['confused', 'puzzled', 'perplexed', 'bewildered'],
    sleepy: ['sleepy', 'tired', 'exhausted', 'drowsy'],
    neutral: ['neutral', 'okay', 'fine', 'alright']
  };

  for (const [sentiment, keywords] of Object.entries(sentiments)) {
    if (keywords.some(keyword => lowercaseText.includes(keyword))) {
      return sentiment;
    }
  }

  return 'neutral';
}

function updateFaceBasedOnSentiment(sentiment) {
  setExpressionSmooth(sentiment);
  
  const colors = {
    angry: 0xff0000,
    happy: 0x00ff00,
    sad: 0x0000ff,
    surprised: 0xffff00,
    confused: 0xff00ff,
    sleepy: 0x808080,
    neutral: 0x00ff00
  };

  gsap.to(headMaterial.color, {
    r: (colors[sentiment] >> 16) / 255,
    g: ((colors[sentiment] >> 8) & 0xff) / 255,
    b: (colors[sentiment] & 0xff) / 255,
    duration: 0.3
  });
}

function resetFaceColor() {
  gsap.to(headMaterial.color, {
    r: 0,
    g: 1,
    b: 0,
    duration: 0.3
  });
}

async function callExternalAPI(input) {
  const apiUrl = 'https://api.mistral.ai/v1/chat/completions';
  const headers = {
    'Content-Type': 'application/json',
    'Accept': 'application/json',
    'Authorization': `Bearer ${apiKey}`
  };
  const body = JSON.stringify({
    model: "mistral-large-latest",
    messages: [{"role": "user", "content": "Answer the following query in 3 sentences or less - " + input}]
  });

  try {
    const response = await fetch(apiUrl, {
      method: 'POST',
      headers: headers,
      body: body
    });
    const data = await response.json();
    return data.choices[0].message.content.trim();
  } catch (error) {
    console.error('Error calling API:', error);
    return "I'm sorry, I couldn't process your request at the moment. Please try again later.";
  }
}

async function generateResponse(input) {
  const lowercaseInput = input.toLowerCase();
  if (lowercaseInput.includes('hello') || lowercaseInput.includes('hi')) {
    return "Hello! How can I help you today?";
  } else if (lowercaseInput.includes('how are you')) {
    return "I'm doing well, thank you for asking! How about you?";
  } else if (lowercaseInput.includes('bye') || lowercaseInput.includes('goodbye')) {
    return "Goodbye! It was nice chatting with you.";
  } else {
    return await callExternalAPI(input);
  }
}

function typeOutResponse(response) {
  const caption = document.getElementById('caption');
  caption.innerHTML = '';
  let i = 0;
  const typingSpeed = 50;

  function typeChar() {
    if (i < response.length) {
      caption.innerHTML += response.charAt(i);
      i++;
      setTimeout(typeChar, typingSpeed);
    } else {
      setTimeout(() => {
        gsap.to(caption, { opacity: 0, duration: 1, delay: 2 });
      }, 1000);
    }
  }

  gsap.to(caption, { opacity: 1, duration: 0.5 });
  typeChar();
}

const textInput = document.getElementById('textInput');
const speakButton = document.getElementById('speakButton');
const stopButton = document.getElementById('stopButton');

function stopSpeaking() {
  speechSynthesis.cancel();
  isSpeaking = false;
  setExpressionSmooth('neutral');
  resetFaceColor();
  
  speakButton.disabled = false;
  speakButton.textContent = 'Chat';
  stopButton.disabled = true;
  
  const caption = document.getElementById('caption');
  gsap.to(caption, { opacity: 0, duration: 0.5 });
  
  head.userData.targetRotation = getRandomRotation();
  gsap.to(head.rotation, {
    x: head.userData.targetRotation.x,
    y: head.userData.targetRotation.y,
    z: head.userData.targetRotation.z,
    duration: 1,
    ease: "power2.inOut",
    onComplete: () => {
      isIdling = true;
    }
  });
}

function updateMouthAndExpressionBasedOnSpeech() {
  const mouthOpenDuration = 0.1;
  const mouthCloseDuration = 0.1;
  const blinkInterval = 3000;

  function animateMouth() {
    if (!isSpeaking) return;

    gsap.to(mouth.scale, {
      y: 1.5,
      duration: mouthOpenDuration,
      ease: "power1.inOut",
      onComplete: () => {
        gsap.to(mouth.scale, {
          y: 1,
          duration: mouthCloseDuration,
          ease: "power1.inOut",
          onComplete: animateMouth
        });
      }
    });
  }

  function animateEyebrows() {
    if (!isSpeaking) return;

    const duration = 0.5;
    const ease = "power1.inOut";

    gsap.to([leftEyebrow.position, rightEyebrow.position], {
      y: `+=${Math.random() * 0.2 - 0.1}`,
      duration,
      ease,
      onComplete: animateEyebrows
    });

    gsap.to([leftEyebrow.rotation, rightEyebrow.rotation], {
      z: `+=${Math.random() * 0.1 - 0.05}`,
      duration,
      ease
    });
  }

  animateMouth();
  animateEyebrows();
  
  const blinkDuration = 0.15;
  const halfBlinkDuration = blinkDuration / 2;

  function blinkWhileSpeaking() {
    if (!isSpeaking) return;

    blinkEyes();
    setTimeout(blinkWhileSpeaking, blinkInterval);
  }

  blinkWhileSpeaking();
}

stopButton.addEventListener('click', stopSpeaking);

speakButton.addEventListener('click', async () => {
  const text = textInput.value;
  if (text.trim() === '' || isSpeaking) return;

  centerHead();
  isSpeaking = true;

  speakButton.disabled = true;
  speakButton.textContent = 'Thinking...';
  stopButton.disabled = false;

  const response = await generateResponse(text);
  const sentiment = analyzeSentiment(response);
  updateFaceBasedOnSentiment(sentiment);

  speakButton.textContent = 'Chat';

  const utterance = new SpeechSynthesisUtterance(response);
  
  utterance.onstart = () => {
    updateMouthAndExpressionBasedOnSpeech();
    typeOutResponse(response);
  };

  utterance.onend = stopSpeaking;

  speechSynthesis.cancel();

  speechSynthesis.speak(utterance);

  textInput.value = '';
});

init();
</script>
</body></html>
