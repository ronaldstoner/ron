<div class="home">
    <input type="text" id="post-search" class="post-search" placeholder="Search posts by title or tag&hellip;" aria-label="Search posts" autocomplete="off">
    <p id="post-search-empty" class="post-search-empty" hidden>No posts match your search.</p>
    <ul class="post-list" id="post-list">
        {% for post in site.posts %}
            <li class="post-box" data-title="{{ post.title | downcase | escape }}" data-tags="{% for tag in post.tags %}{{ tag | downcase }} {% endfor %}">
                <a href="{{ post.url | prepend: site.baseurl }}">
                    <h2 class="post-link">{{ post.title }}</h2>
                </a>
                <span class="date">{{ post.date | date: "%B %d %Y"}}</span>
                {% if post.tags and post.tags != empty %}
                <span class="post-list-tags">{% for tag in post.tags %}<a href="{{ '/tags/' | append: tag | append: '/' | relative_url }}">#{{ tag }}</a> {% endfor %}</span>
                {% endif %}
                <p>{{post.content | strip_html | truncate: 300}}</p>
            </li>
        {% endfor %}
    </ul>
</div>

<script>
(function () {
    var input = document.getElementById('post-search');
    var list = document.getElementById('post-list');
    if (!input || !list) return;
    var items = list.getElementsByClassName('post-box');
    var empty = document.getElementById('post-search-empty');
    input.addEventListener('input', function () {
        var q = input.value.trim().toLowerCase();
        var visible = 0;
        for (var i = 0; i < items.length; i++) {
            var el = items[i];
            var hay = (el.getAttribute('data-title') || '') + ' ' + (el.getAttribute('data-tags') || '');
            var match = q === '' || hay.indexOf(q) !== -1;
            el.style.display = match ? '' : 'none';
            if (match) visible++;
        }
        if (empty) empty.hidden = visible !== 0;
    });
})();
</script>
